<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of products; trackBy: trackByProductId" [class.red-rowy]="p.price < 0" [class.green-row]="p.price > 0">
      <td>{{ p.id }}</td>
      <td>{{ p.name }}</td>
      <td [class.red-price]="p.price < 0" [class.green-price]="p.price > 0">{{ p.price }}</td>
      <td><img [src]="p.image" alt="{{ p.name }}" width="100" height="100"></td>
    </tr>
  </tbody>
</table>
