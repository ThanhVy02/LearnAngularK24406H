<p>product-list-call-service-component works!</p>
Min Price: <input type="number" [(ngModel)]="minPrice">
Max Price: <input type="number" [(ngModel)]="maxPrice">
<button (click)="doFilter()">Filter</button>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products; track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }}</td>
        <td><img [src]="p.image" alt="{{ p.name }}" width="100" height="100"></td>
      </tr>
    }
    @empty {
      <tr>
        <td colspan="4">No products available.</td>
      </tr>
    }
  </tbody>
</table>
